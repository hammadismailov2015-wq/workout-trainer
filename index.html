<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Домашний Тренажёр 💪</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренажёр">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ЭКРАН: Главная -->
  <section class="screen active" id="screen-home">
    <header class="app-header">
      <button class="voice-toggle" id="voice-toggle" title="Голос тренера" aria-label="Голос тренера">🔊</button>
      <h1>💪 Тренажёр</h1>
      <p class="subtitle">Тренировки дома без оборудования</p>
    </header>

    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-value" id="stat-workouts">0</span>
        <span class="stat-label">тренировок</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-streak">0</span>
        <span class="stat-label">дней подряд</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-minutes">0</span>
        <span class="stat-label">минут всего</span>
      </div>
    </div>

    <h2 class="section-title">Готовые программы</h2>
    <div class="program-list" id="program-list"></div>

    <h2 class="section-title">Свободная тренировка</h2>
    <div class="program-list">
      <button class="program-card custom" id="btn-custom">
        <span class="program-emoji">⚙️</span>
        <span class="program-name">Собрать свою</span>
        <span class="program-meta">выбери упражнения</span>
      </button>
    </div>
  </section>

  <!-- ЭКРАН: Конструктор своей тренировки -->
  <section class="screen" id="screen-builder">
    <header class="screen-header">
      <button class="back-btn" data-goto="home">‹ Назад</button>
      <h2>Своя тренировка</h2>
    </header>
    <div class="builder-settings">
      <label class="setting">
        <span>Работа (сек)</span>
        <input type="number" id="set-work" value="40" min="5" max="300">
      </label>
      <label class="setting">
        <span>Отдых (сек)</span>
        <input type="number" id="set-rest" value="20" min="0" max="300">
      </label>
      <label class="setting">
        <span>Кругов</span>
        <input type="number" id="set-rounds" value="2" min="1" max="10">
      </label>
    </div>
    <p class="hint">Выбери упражнения (нажми, чтобы добавить):</p>
    <div class="exercise-grid" id="exercise-grid"></div>
    <div class="builder-footer">
      <span id="builder-count">Выбрано: 0</span>
      <button class="btn-primary" id="btn-start-custom" disabled>Начать</button>
    </div>
  </section>

  <!-- ЭКРАН: Тренировка -->
  <section class="screen workout-screen" id="screen-workout">
    <div class="workout-top">
      <button class="close-btn" id="btn-quit">✕</button>
      <div class="round-badge" id="round-badge">Круг 1/2</div>
    </div>

    <div class="workout-body" id="workout-body">
      <p class="phase-label" id="phase-label">Приготовься</p>
      <div class="robot-stage" id="robot-stage">
        <svg class="robot" id="robot" viewBox="0 0 200 250" aria-hidden="true">
          <defs>
            <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f1f5f9"/>
              <stop offset="0.5" stop-color="#94a3b8"/>
              <stop offset="1" stop-color="#475569"/>
            </linearGradient>
            <linearGradient id="metal2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cbd5e1"/>
              <stop offset="1" stop-color="#334155"/>
            </linearGradient>
          </defs>
          <ellipse class="r-shadow" id="r-shadow" cx="100" cy="240" rx="56" ry="8"/>
          <line class="r-ground" id="r-ground" x1="26" y1="222" x2="174" y2="222" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
          <g id="r-body">
            <!-- НОГИ (бедро + голень + стопа) -->
            <g class="limb" id="r-leg-l">
              <rect x="73" y="156" width="22" height="34" rx="9" fill="url(#metal)"/>
              <circle cx="84" cy="188" r="7" fill="#334155"/>
              <rect x="75" y="184" width="18" height="32" rx="8" fill="url(#metal2)"/>
              <rect x="68" y="212" width="31" height="14" rx="6" fill="#1e293b"/>
            </g>
            <g class="limb" id="r-leg-r">
              <rect x="105" y="156" width="22" height="34" rx="9" fill="url(#metal)"/>
              <circle cx="116" cy="188" r="7" fill="#334155"/>
              <rect x="107" y="184" width="18" height="32" rx="8" fill="url(#metal2)"/>
              <rect x="101" y="212" width="31" height="14" rx="6" fill="#1e293b"/>
            </g>
            <!-- РУКИ (плечо + предплечье + кулак) -->
            <g class="limb" id="r-arm-l">
              <rect x="49" y="100" width="20" height="30" rx="9" fill="url(#metal)"/>
              <circle cx="59" cy="129" r="6" fill="#334155"/>
              <rect x="50" y="126" width="18" height="30" rx="8" fill="url(#metal2)"/>
              <rect x="49" y="152" width="20" height="15" rx="6" fill="#475569"/>
            </g>
            <g class="limb" id="r-arm-r">
              <rect x="131" y="100" width="20" height="30" rx="9" fill="url(#metal)"/>
              <circle cx="141" cy="129" r="6" fill="#334155"/>
              <rect x="132" y="126" width="18" height="30" rx="8" fill="url(#metal2)"/>
              <rect x="131" y="152" width="20" height="15" rx="6" fill="#475569"/>
            </g>
            <!-- ТОРС (накачанный корпус) -->
            <g id="r-torso">
              <!-- корпус -->
              <path d="M66,102 Q64,96 72,95 L128,95 Q136,96 134,102 L130,140 Q128,160 116,161 L84,161 Q72,160 70,140 Z"
                    fill="url(#metal)" stroke="#cbd5e1" stroke-width="1.5"/>
              <!-- наплечники -->
              <ellipse cx="60" cy="103" rx="16" ry="13" fill="url(#metal2)" stroke="#cbd5e1" stroke-width="1.5"/>
              <ellipse cx="140" cy="103" rx="16" ry="13" fill="url(#metal2)" stroke="#cbd5e1" stroke-width="1.5"/>
              <!-- грудные пластины -->
              <path d="M84,108 Q98,104 99,118 Q98,126 86,126 Q80,122 80,114 Z" fill="#64748b" opacity=".55"/>
              <path d="M116,108 Q102,104 101,118 Q102,126 114,126 Q120,122 120,114 Z" fill="#64748b" opacity=".55"/>
              <!-- ядро (светящееся) -->
              <circle class="r-chest" cx="100" cy="132" r="8" fill="#22d3ee"/>
              <circle cx="100" cy="132" r="3.5" fill="#ecfeff"/>
              <!-- пресс -->
              <g stroke="#334155" stroke-width="2" opacity=".7">
                <line x1="88" y1="144" x2="112" y2="144"/>
                <line x1="90" y1="152" x2="110" y2="152"/>
                <line x1="100" y1="140" x2="100" y2="157"/>
              </g>
            </g>
            <!-- ГОЛОВА -->
            <g id="r-head">
              <line x1="100" y1="28" x2="100" y2="44" stroke="#94a3b8" stroke-width="3"/>
              <circle class="r-antenna" cx="100" cy="24" r="6" fill="#22d3ee"/>
              <rect x="72" y="90" width="56" height="8" rx="4" fill="#475569"/> <!-- шея/воротник -->
              <rect x="74" y="44" width="52" height="48" rx="16" fill="url(#metal)" stroke="#cbd5e1" stroke-width="2"/>
              <g id="r-face">
                <rect x="80" y="58" width="40" height="22" rx="11" fill="#0f172a"/> <!-- визор -->
                <circle class="r-eye" cx="89" cy="69" r="7" fill="#22d3ee"/>
                <circle class="r-eye" cx="111" cy="69" r="7" fill="#22d3ee"/>
                <circle cx="89" cy="69" r="2.6" fill="#ecfeff"/>
                <circle cx="111" cy="69" r="2.6" fill="#ecfeff"/>
                <g stroke="#334155" stroke-width="2.4">
                  <line x1="92" y1="84" x2="92" y2="88"/><line x1="98" y1="84" x2="98" y2="88"/>
                  <line x1="104" y1="84" x2="104" y2="88"/><line x1="110" y1="84" x2="110" y2="88"/>
                </g>
              </g>
            </g>
          </g>
        </svg>
        <!-- Отжимания: робот в профиль, лицом и животом в пол -->
        <svg class="robot-side" id="robot-pushup" viewBox="0 0 200 250" aria-hidden="true">
          <defs>
            <linearGradient id="pmetal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f1f5f9"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/>
            </linearGradient>
            <linearGradient id="pmetal2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#334155"/>
            </linearGradient>
          </defs>
          <line x1="26" y1="212" x2="176" y2="212" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
          <g id="pu-body">
            <!-- дальние конечности (за корпусом, темнее) -->
            <rect x="118" y="150" width="12" height="58" rx="6" fill="url(#pmetal2)"/> <!-- дальняя рука -->
            <g id="pu-leg-far" class="pu-leg"><rect x="70" y="150" width="13" height="58" rx="6" fill="url(#pmetal2)"/></g>
            <!-- корпус-планка -->
            <rect x="52" y="148" width="102" height="28" rx="14" fill="url(#pmetal)" stroke="#cbd5e1" stroke-width="1.5"/>
            <!-- панель на спине (верх) -->
            <rect x="66" y="151" width="30" height="6" rx="3" fill="#64748b" opacity=".55"/>
            <!-- пресс/кубики на животе (низ) -->
            <g stroke="#334155" stroke-width="2" opacity=".75">
              <line x1="92" y1="168" x2="128" y2="168"/>
              <line x1="100" y1="164" x2="100" y2="174"/>
              <line x1="110" y1="164" x2="110" y2="174"/>
              <line x1="120" y1="164" x2="120" y2="174"/>
            </g>
            <!-- ближние конечности (перед корпусом, к полу) -->
            <g id="pu-arm"><rect x="132" y="158" width="14" height="52" rx="7" fill="url(#pmetal)"/><circle cx="139" cy="208" r="7" fill="#475569"/></g>
            <g id="pu-leg-near" class="pu-leg"><rect x="58" y="158" width="15" height="52" rx="7" fill="url(#pmetal)"/><rect x="52" y="204" width="27" height="10" rx="4" fill="#1e293b"/></g>
            <!-- голова опущена: лицо и глаз смотрят вниз в пол -->
            <g id="pu-head">
              <line x1="178" y1="150" x2="184" y2="140" stroke="#94a3b8" stroke-width="3"/>
              <circle class="r-antenna" cx="186" cy="137" r="5" fill="#22d3ee"/>
              <path d="M150,150 Q150,131 169,130 Q189,130 190,151 Q190,172 170,179 Q151,178 150,158 Z"
                    fill="url(#pmetal)" stroke="#cbd5e1" stroke-width="1.5"/>
              <circle class="r-eye" cx="162" cy="172" r="6.5" fill="#22d3ee"/>
              <circle cx="162" cy="172" r="2.3" fill="#ecfeff"/>
            </g>
          </g>
        </svg>
        <!-- Супермен: лёжа на животе, руки вперёд и ноги назад подняты (полёт) -->
        <svg class="robot-side" id="robot-superman" viewBox="0 0 200 250" aria-hidden="true">
          <defs>
            <linearGradient id="smetal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f1f5f9"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/>
            </linearGradient>
            <linearGradient id="smetal2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#334155"/>
            </linearGradient>
          </defs>
          <line x1="18" y1="204" x2="184" y2="204" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
          <!-- корпус на полу, животом вниз -->
          <g id="sm-body">
            <rect x="62" y="176" width="80" height="26" rx="13" fill="url(#smetal)" stroke="#cbd5e1" stroke-width="1.5"/>
            <rect x="74" y="179" width="28" height="6" rx="3" fill="#64748b" opacity=".55"/> <!-- спина сверху -->
            <g stroke="#334155" stroke-width="2" opacity=".7">                                <!-- пресс снизу -->
              <line x1="92" y1="196" x2="120" y2="196"/>
              <line x1="100" y1="192" x2="100" y2="200"/>
              <line x1="110" y1="192" x2="110" y2="200"/>
            </g>
          </g>
          <!-- поднимающиеся руки, ноги и голова (полёт) -->
          <g id="sm-lift">
            <!-- ноги назад-вверх (слева), корнями в корпус -->
            <rect x="20" y="172" width="52" height="12" rx="6" fill="url(#smetal2)" transform="rotate(24 70 184)"/>
            <rect x="18" y="180" width="54" height="14" rx="7" fill="url(#smetal)" transform="rotate(30 72 188)"/>
            <!-- руки вперёд-вверх (справа), корнями в корпус -->
            <rect x="130" y="172" width="52" height="12" rx="6" fill="url(#smetal2)" transform="rotate(-24 134 184)"/>
            <rect x="130" y="180" width="54" height="14" rx="7" fill="url(#smetal)" transform="rotate(-30 132 188)"/>
            <!-- голова поднята, смотрит вперёд -->
            <g id="sm-head">
              <line x1="150" y1="170" x2="156" y2="160" stroke="#94a3b8" stroke-width="3"/>
              <circle class="r-antenna" cx="158" cy="157" r="5" fill="#22d3ee"/>
              <path d="M138,180 Q138,161 157,160 Q177,160 178,180 Q177,199 158,200 Q139,199 138,187 Z"
                    fill="url(#smetal)" stroke="#cbd5e1" stroke-width="1.5"/>
              <circle class="r-eye" cx="170" cy="178" r="6.5" fill="#22d3ee"/>
              <circle cx="172" cy="177" r="2.3" fill="#ecfeff"/>
            </g>
          </g>
        </svg>
        <!-- Приседание: робот в профиль, руки вытянуты вперёд (всегда видны) -->
        <svg class="robot-side" id="robot-squat" viewBox="0 0 200 250" aria-hidden="true">
          <defs>
            <linearGradient id="qmetal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f1f5f9"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/>
            </linearGradient>
            <linearGradient id="qmetal2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#334155"/>
            </linearGradient>
          </defs>
          <line x1="52" y1="216" x2="150" y2="216" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
          <!-- стопы на полу -->
          <rect x="84" y="208" width="34" height="10" rx="4" fill="#1e293b"/>
          <!-- дальняя нога (статичная, темнее) -->
          <g opacity=".9">
            <rect x="104" y="170" width="14" height="42" rx="7" fill="url(#qmetal2)"/>
            <rect x="103" y="132" width="15" height="42" rx="7" fill="url(#qmetal2)"/>
          </g>
          <!-- ближняя голень (статично) -->
          <rect x="92" y="170" width="16" height="44" rx="7" fill="url(#qmetal)"/>
          <!-- бедро → корпус (сгибается в колене) -->
          <g id="sq-thigh">
            <rect x="91" y="130" width="18" height="46" rx="8" fill="url(#qmetal)"/>
            <g id="sq-upper">
              <!-- торс -->
              <rect x="86" y="88" width="28" height="48" rx="12" fill="url(#qmetal)" stroke="#cbd5e1" stroke-width="1.5"/>
              <rect x="87" y="92" width="6" height="36" rx="3" fill="#64748b" opacity=".5"/> <!-- спина -->
              <circle class="r-chest" cx="104" cy="110" r="6" fill="#22d3ee"/>
              <g stroke="#334155" stroke-width="2" opacity=".6">
                <line x1="100" y1="118" x2="110" y2="118"/><line x1="100" y1="124" x2="109" y2="124"/>
              </g>
              <!-- руки вытянуты вперёд (вправо) — всегда видны -->
              <rect x="110" y="94" width="42" height="12" rx="6" fill="url(#qmetal2)"/>
              <g id="sq-arm"><rect x="110" y="104" width="46" height="13" rx="6" fill="url(#qmetal)"/><circle cx="154" cy="110" r="7" fill="#475569"/></g>
              <!-- голова, смотрит вперёд -->
              <line x1="100" y1="58" x2="100" y2="70" stroke="#94a3b8" stroke-width="3"/>
              <circle class="r-antenna" cx="100" cy="54" r="5" fill="#22d3ee"/>
              <rect x="85" y="58" width="33" height="33" rx="14" fill="url(#qmetal)" stroke="#cbd5e1" stroke-width="1.5"/>
              <circle class="r-eye" cx="110" cy="74" r="6.5" fill="#22d3ee"/>
              <circle cx="112" cy="73" r="2.3" fill="#ecfeff"/>
            </g>
          </g>
        </svg>
        <!-- Пресс: лёжа на спине, ноги согнуты, корпус поднимается (скручивание) -->
        <svg class="robot-side" id="robot-crunch" viewBox="0 0 200 250" aria-hidden="true">
          <defs>
            <linearGradient id="cmetal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f1f5f9"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/>
            </linearGradient>
            <linearGradient id="cmetal2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#334155"/>
            </linearGradient>
          </defs>
          <line x1="24" y1="210" x2="176" y2="210" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
          <!-- согнутые ноги: бедро вверх, голень к стопе на полу -->
          <rect x="128" y="200" width="30" height="10" rx="4" fill="#1e293b"/> <!-- стопа -->
          <rect x="118" y="166" width="14" height="40" rx="7" fill="url(#cmetal2)" transform="rotate(28 125 204)"/> <!-- голень -->
          <rect x="98" y="164" width="40" height="15" rx="7" fill="url(#cmetal)" transform="rotate(-18 104 172)"/> <!-- бедро -->
          <!-- таз на полу -->
          <ellipse cx="104" cy="196" rx="14" ry="10" fill="url(#cmetal)"/>
          <!-- корпус со спиной, поднимается к коленям -->
          <g id="ab-torso">
            <rect x="50" y="184" width="60" height="21" rx="10" fill="url(#cmetal)" stroke="#cbd5e1" stroke-width="1.5"/>
            <g stroke="#334155" stroke-width="2" opacity=".65">                      <!-- пресс -->
              <line x1="66" y1="188" x2="66" y2="201"/><line x1="76" y1="188" x2="76" y2="201"/>
              <line x1="86" y1="188" x2="86" y2="201"/><line x1="58" y1="194" x2="96" y2="194"/>
            </g>
            <!-- руки тянутся к коленям -->
            <rect x="86" y="172" width="34" height="11" rx="5" fill="url(#cmetal2)" transform="rotate(-24 90 182)"/>
            <!-- голова -->
            <line x1="52" y1="188" x2="45" y2="180" stroke="#94a3b8" stroke-width="3"/>
            <circle class="r-antenna" cx="43" cy="177" r="5" fill="#22d3ee"/>
            <rect x="34" y="182" width="30" height="26" rx="13" fill="url(#cmetal)" stroke="#cbd5e1" stroke-width="1.5"/>
            <circle class="r-eye" cx="46" cy="192" r="6" fill="#22d3ee"/>
            <circle cx="45" cy="191" r="2.2" fill="#ecfeff"/>
          </g>
        </svg>
        <!-- Подъём ног: лёжа на спине, прямые ноги поднимаются вверх и опускаются -->
        <svg class="robot-side" id="robot-legraise" viewBox="0 0 200 250" aria-hidden="true">
          <defs>
            <linearGradient id="lmetal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f1f5f9"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/>
            </linearGradient>
            <linearGradient id="lmetal2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#334155"/>
            </linearGradient>
          </defs>
          <line x1="22" y1="208" x2="178" y2="208" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
          <!-- голова на полу (слева) -->
          <line x1="52" y1="192" x2="44" y2="184" stroke="#94a3b8" stroke-width="3"/>
          <circle class="r-antenna" cx="42" cy="181" r="5" fill="#22d3ee"/>
          <rect x="32" y="186" width="30" height="24" rx="12" fill="url(#lmetal)" stroke="#cbd5e1" stroke-width="1.5"/>
          <circle class="r-eye" cx="45" cy="194" r="6" fill="#22d3ee"/>
          <circle cx="44" cy="193" r="2.2" fill="#ecfeff"/>
          <!-- рука вдоль пола -->
          <rect x="72" y="200" width="34" height="9" rx="4" fill="url(#lmetal2)"/>
          <!-- корпус на полу (спина внизу, живот сверху) -->
          <rect x="54" y="188" width="68" height="18" rx="9" fill="url(#lmetal)" stroke="#cbd5e1" stroke-width="1.5"/>
          <g stroke="#334155" stroke-width="2" opacity=".65">  <!-- пресс сверху -->
            <line x1="72" y1="188" x2="72" y2="197"/><line x1="84" y1="188" x2="84" y2="197"/>
            <line x1="96" y1="188" x2="96" y2="197"/><line x1="108" y1="188" x2="108" y2="197"/>
          </g>
          <!-- прямые ноги, поднимаются от бедра -->
          <g id="lr-legs">
            <rect x="120" y="184" width="76" height="13" rx="6" fill="url(#lmetal2)"/>            <!-- дальняя нога -->
            <rect x="120" y="192" width="72" height="15" rx="7" fill="url(#lmetal)"/>              <!-- ближняя нога -->
            <circle cx="158" cy="199" r="6" fill="#334155"/>                                       <!-- колено -->
            <rect x="188" y="188" width="12" height="20" rx="4" fill="#1e293b"/>                    <!-- стопа -->
          </g>
        </svg>
        <!-- Стульчик: сидит спиной к стене, бёдра горизонтально (удержание) -->
        <svg class="robot-side" id="robot-wallsit" viewBox="0 0 200 250" aria-hidden="true">
          <defs>
            <linearGradient id="wmetal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f1f5f9"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/>
            </linearGradient>
            <linearGradient id="wmetal2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#334155"/>
            </linearGradient>
          </defs>
          <rect x="150" y="58" width="10" height="150" rx="3" fill="#475569"/> <!-- стена -->
          <line x1="40" y1="208" x2="150" y2="208" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
          <g id="ws-all">
            <!-- дальняя нога (темнее) -->
            <g opacity=".9">
              <rect x="96" y="168" width="48" height="13" rx="6" fill="url(#wmetal2)"/>
              <rect x="94" y="172" width="13" height="34" rx="6" fill="url(#wmetal2)"/>
            </g>
            <!-- стопа -->
            <rect x="80" y="200" width="30" height="9" rx="4" fill="#1e293b"/>
            <!-- голень вертикально -->
            <rect x="90" y="170" width="15" height="38" rx="7" fill="url(#wmetal)"/>
            <!-- бедро горизонтально -->
            <rect x="94" y="164" width="52" height="16" rx="8" fill="url(#wmetal)"/>
            <circle cx="99" cy="172" r="6" fill="#334155"/> <!-- колено -->
            <!-- корпус вертикально, спиной к стене -->
            <rect x="132" y="110" width="22" height="60" rx="9" fill="url(#wmetal)" stroke="#cbd5e1" stroke-width="1.5"/>
            <circle class="r-chest" cx="143" cy="130" r="5" fill="#22d3ee"/>
            <!-- рука на бедре -->
            <rect x="104" y="150" width="40" height="11" rx="5" fill="url(#wmetal2)"/>
            <!-- голова -->
            <line x1="143" y1="82" x2="143" y2="94" stroke="#94a3b8" stroke-width="3"/>
            <circle class="r-antenna" cx="143" cy="78" r="5" fill="#22d3ee"/>
            <rect x="127" y="82" width="32" height="30" rx="13" fill="url(#wmetal)" stroke="#cbd5e1" stroke-width="1.5"/>
            <circle class="r-eye" cx="134" cy="97" r="6.5" fill="#22d3ee"/>
            <circle cx="132" cy="96" r="2.3" fill="#ecfeff"/>
          </g>
        </svg>
        <!-- Выпады: нога вперёд согнута, задняя назад; приседание вниз-вверх -->
        <svg class="robot-side" id="robot-lunge" viewBox="0 0 200 250" aria-hidden="true">
          <defs>
            <linearGradient id="nmetal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f1f5f9"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/>
            </linearGradient>
            <linearGradient id="nmetal2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#334155"/>
            </linearGradient>
          </defs>
          <line x1="24" y1="212" x2="176" y2="212" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
          <g id="ln-all">
            <!-- задняя нога (назад-вниз, слева) -->
            <rect x="66" y="146" width="40" height="13" rx="6" fill="url(#nmetal2)" transform="rotate(-42 104 152)"/>
            <rect x="58" y="172" width="13" height="36" rx="6" fill="url(#nmetal2)" transform="rotate(-20 66 176)"/>
            <rect x="46" y="204" width="24" height="9" rx="4" fill="#1e293b"/>
            <!-- передняя нога (вперёд, согнута, справа) -->
            <rect x="100" y="146" width="36" height="14" rx="7" fill="url(#nmetal)" transform="rotate(40 104 152)"/>
            <rect x="122" y="176" width="15" height="36" rx="7" fill="url(#nmetal)"/>
            <rect x="118" y="205" width="28" height="9" rx="4" fill="#1e293b"/>
            <circle cx="129" cy="178" r="6" fill="#334155"/>
            <!-- корпус вертикально -->
            <rect x="92" y="106" width="24" height="46" rx="11" fill="url(#nmetal)" stroke="#cbd5e1" stroke-width="1.5"/>
            <circle class="r-chest" cx="104" cy="126" r="5.5" fill="#22d3ee"/>
            <!-- рука вдоль тела -->
            <rect x="99" y="120" width="12" height="34" rx="6" fill="url(#nmetal2)" transform="rotate(6 105 122)"/>
            <!-- голова -->
            <line x1="104" y1="76" x2="104" y2="88" stroke="#94a3b8" stroke-width="3"/>
            <circle class="r-antenna" cx="104" cy="72" r="5" fill="#22d3ee"/>
            <rect x="89" y="76" width="32" height="31" rx="13" fill="url(#nmetal)" stroke="#cbd5e1" stroke-width="1.5"/>
            <circle class="r-eye" cx="113" cy="91" r="6.5" fill="#22d3ee"/>
            <circle cx="115" cy="90" r="2.3" fill="#ecfeff"/>
          </g>
        </svg>
      </div>
      <h2 class="exercise-name" id="ex-name">Разминка</h2>
      <div class="timer-ring">
        <svg viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="54"></circle>
          <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="54"></circle>
        </svg>
        <span class="timer-text" id="timer-text">10</span>
      </div>
      <p class="next-up" id="next-up"></p>
    </div>

    <div class="workout-controls">
      <button class="ctrl-btn" id="btn-prev">⏮</button>
      <button class="ctrl-btn big" id="btn-pause">⏸</button>
      <button class="ctrl-btn" id="btn-next">⏭</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </section>

  <!-- ЭКРАН: Итоги -->
  <section class="screen" id="screen-done">
    <div class="done-content">
      <div class="done-emoji">🎉</div>
      <h2>Тренировка завершена!</h2>
      <div class="done-stats">
        <div><strong id="done-time">0:00</strong><span>время</span></div>
        <div><strong id="done-ex">0</strong><span>упражнений</span></div>
        <div><strong id="done-cal">0</strong><span>ккал ≈</span></div>
      </div>
      <button class="btn-primary" data-goto="home">На главную</button>
    </div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
